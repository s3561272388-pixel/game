name: 共鸣行囊 Windows Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'wuwa-backpack/**'
      - 'apps/**'
      - 'desktop/**'
      - 'packages/**'
      - 'assets/**'
      - 'data/**'
      - 'tools/**'
      - 'package*.json'
      - 'electron-builder.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: wuwa-backpack-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 's3561272388-pixel/Wuthering-Waves-Backpack-Brawl' && github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Locate game
        shell: pwsh
        run: |
          if (Test-Path 'wuwa-backpack/package.json') { $game = 'wuwa-backpack' }
          elseif (Test-Path 'package.json') { $game = '.' }
          else { throw 'Game package not found' }
          "GAME_DIR=$game" >> $env:GITHUB_ENV
      - name: Install, test and build Windows installer
        working-directory: ${{ env.GAME_DIR }}
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          npm run release
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Package offline web version and checksums
        working-directory: ${{ env.GAME_DIR }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP 'wuwa-web'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath '开始游戏.html','assets','licenses','ATTRIBUTIONS.md','README.md' -Destination $stage -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "release/Resonance-Backpack-Web-$version.zip"
          Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|zip)$' -and $_.Name -notmatch '__uninstaller' } | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
      - name: Publish repository Release
        working-directory: ${{ env.GAME_DIR }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "wuwa-backpack-v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; increase the package version instead of overwriting it." }
          gh release create $tag "release/Resonance-Backpack-Setup-$version-x64.exe" "release/Resonance-Backpack-Web-$version.zip" 'release/SHA256SUMS.txt' --target $env:GITHUB_SHA --title "共鸣行囊 v$version · 共鸣终端" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
